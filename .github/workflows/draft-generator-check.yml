name: Draft Generator Check

on:
  push:
    paths:
      - "2027/**"
      - ".github/workflows/draft-generator-check.yml"
  pull_request:
    paths:
      - "2027/**"
      - ".github/workflows/draft-generator-check.yml"
  workflow_dispatch:

jobs:
  build-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build 2027 pages
        run: python 2027/build.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: n4m-2027-draft-preview
          path: 2027/*.html
